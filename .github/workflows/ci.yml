name: NextMail AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # Job 1: Backend Automated Test & Build Verification
  # ==============================================================================
  backend-verification:
    name: Backend (Java 21 LTS / Spring Boot 3.3.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Hermetic Unit & Integration Tests (84 tests)
        working-directory: backend
        run: mvn -B clean test

      - name: Package Executable Artifact
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Archive Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextmail-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ==============================================================================
  # Job 2: Frontend Type Check & Bundle Verification
  # ==============================================================================
  frontend-verification:
    name: Frontend (React 19 / TypeScript / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check and Production Bundle Build
        working-directory: frontend
        run: npm run build

      - name: Archive Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: nextmail-frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==============================================================================
  # Job 3: Multi-Stage Docker Build Verification
  # ==============================================================================
  docker-verification:
    name: Docker Multi-Stage Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-verification]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nextmail-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nextmail-frontend:test
